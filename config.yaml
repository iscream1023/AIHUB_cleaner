
path:
  src_root: "/home/haggi/fire_detection_datasets/AI-HUB segmentation/my_datasets"
  dst_root: "/home/haggi/fire_detection_datasets/AI-HUB segmentation/temp_datasets"
  raw_labels: "/home/haggi/fire_detection_datasets/AI-HUB segmentation/temp_datasets/labels"
  label_output_dir: "/home/haggi/fire_detection_datasets/AI-HUB segmentation/yolo_labels"

dedup:
  hash_size: 8
  threshold: 2  # Hamming distance (lower = stricter removal)

# Class Mapping (Original_ID: Target_ID)
# IDs not listed here will be automatically filtered out.
class_mapping:
  1: 1 # Black Smoke -> Smoke
  2: 1 # White Smoke -> Smoke
  3: 0 # Flame -> Fire

# Conversion Mode: "seg" or "box"
mode: "seg" 

sampling:
  split_ratio: 0.8

class_names:
  0: "fire"
  1: "smoke"
